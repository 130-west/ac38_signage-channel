<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AC38 Weather Symbols Preview</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; background: #081522; color: #fff; font-family: Inter, Arial, Helvetica, sans-serif; }
    body { display: grid; place-items: center; padding: 4vh 4vw; }
    .preview { width: min(1180px, 100%); }
    h1 { margin: 0 0 2.5vh; font-size: clamp(28px, 3.4vw, 58px); line-height: 1; text-transform: uppercase; letter-spacing: 0; }
    .grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px; }
    .card { min-height: 220px; display: grid; grid-template-rows: 1fr auto; align-items: center; justify-items: center; padding: 22px; background: linear-gradient(135deg, rgba(7,23,37,.95), rgba(18,56,82,.76)); border-top: 7px solid #3299c9; }
    .label { width: 100%; padding-top: 18px; border-top: 1px solid rgba(255,255,255,.13); color: #d9e9ff; font-size: 18px; font-weight: 900; text-align: center; text-transform: uppercase; }
    .weather-icon { position: relative; width: 154px; height: 116px; display: grid; place-items: center; background: rgba(255,255,255,.16); overflow: hidden; }
    .weather-symbol { position: relative; width: min(82%, 98px); aspect-ratio: 1 / 1; background: center / contain no-repeat; }

      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

</head>
<body>
  <main class="preview">
    <h1>Weather Symbols</h1>
    <section class="grid" aria-label="Weather symbol preview">
      <article class="card"><div class="weather-icon"><div class="weather-symbol sun"></div></div><div class="label">Sun</div></article>
      <article class="card"><div class="weather-icon"><div class="weather-symbol cloud"></div></div><div class="label">Partly Cloudy</div></article>
      <article class="card"><div class="weather-icon"><div class="weather-symbol overcast"></div></div><div class="label">Overcast</div></article>
      <article class="card"><div class="weather-icon"><div class="weather-symbol drizzle"></div></div><div class="label">Drizzle</div></article>
      <article class="card"><div class="weather-icon"><div class="weather-symbol rain"></div></div><div class="label">Rain</div></article>
      <article class="card"><div class="weather-icon"><div class="weather-symbol snow"></div></div><div class="label">Snow</div></article>
      <article class="card"><div class="weather-icon"><div class="weather-symbol fog"></div></div><div class="label">Fog</div></article>
      <article class="card"><div class="weather-icon"><div class="weather-symbol storm"></div></div><div class="label">Storm</div></article>
    </section>
  </main>
</body>
</html>
