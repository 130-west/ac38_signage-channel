<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AC38 Right Rail Zone</title>

  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #fff; color: #07101a; font-family: Inter, Arial, Helvetica, sans-serif; }
    .rail { width: 100vw; height: 100vh; display: grid; grid-template-rows: 33.463% minmax(0, 1fr) 20.623%; background: #fff; }
    .weather { position: relative; display: grid; grid-template-columns: 1fr auto; grid-template-rows: auto 1fr auto; column-gap: 4.2%; align-content: center; padding: 5.6%; background: linear-gradient(135deg, rgba(7,23,37,.94), rgba(7,23,37,.68)), url("https://www.americascup.com/images/m29890_crop11013_1024x1024_proportional_17806775737CDA.jpg") center/cover no-repeat; color: #fff; border-bottom: .75vh solid #3299c9; overflow: hidden; }
    .weather-kicker { grid-column: 1 / -1; color: #8ad7ff; font-size: clamp(10px, 3.1vw, 42px); font-weight: 900; text-transform: uppercase; }
    .weather-temp { align-self: center; font-size: clamp(42px, 12.8vw, 150px); line-height: .9; font-weight: 950; font-variant-numeric: tabular-nums; }
    .weather-icon { align-self: center; justify-self: end; position: relative; width: 22.4vw; height: 10.5vh; display: grid; place-items: center; background: rgba(255,255,255,.16); border-left: .9vw solid #8ad7ff; overflow: hidden; }
    .weather-symbol { --sun: #ffd53d; --cloud: #fff; --rain: #8ad7ff; --mist: #d9e9ff; position: relative; width: min(68%, 9.2vh); aspect-ratio: 1 / 1; }
    .weather-symbol::before, .weather-symbol::after { content: ""; position: absolute; display: block; }
    .weather-symbol.sun::before { width: 52%; height: 52%; left: 24%; top: 24%; border-radius: 50%; background: var(--sun); box-shadow: 0 0 .78em rgba(255,213,61,.72); }
    .weather-symbol.sun::after { inset: 0; border-radius: 50%; background: repeating-conic-gradient(from 0deg, var(--sun) 0 10deg, transparent 10deg 28deg); -webkit-mask: radial-gradient(circle, transparent 0 43%, #000 45% 72%, transparent 74%); mask: radial-gradient(circle, transparent 0 43%, #000 45% 72%, transparent 74%); }
    .weather-symbol.cloud::before, .weather-symbol.rain::before, .weather-symbol.drizzle::before, .weather-symbol.snow::before, .weather-symbol.storm::before { width: 66%; height: 34%; left: 16%; top: 42%; border-radius: 999px; background: var(--cloud); box-shadow: 18% -38% 0 11% var(--cloud), 45% -24% 0 18% var(--cloud), 70% -4% 0 7% var(--cloud); }
    .weather-symbol.cloud::after { width: 36%; height: 36%; left: 5%; top: 18%; border-radius: 50%; background: rgba(255,213,61,.95); box-shadow: 0 0 .7em rgba(255,213,61,.45); }
    .weather-symbol.rain::after, .weather-symbol.drizzle::after { width: 7%; height: 30%; left: 22%; top: 64%; border-radius: 999px; background: var(--rain); box-shadow: .78em .24em 0 var(--rain), 1.56em -.05em 0 var(--rain), 2.34em .18em 0 var(--rain); transform: skewX(-18deg); }
    .weather-symbol.drizzle::after { height: 19%; opacity: .78; }
    .weather-symbol.snow::after { width: 12%; height: 12%; left: 20%; top: 66%; border-radius: 50%; background: var(--cloud); box-shadow: .86em .36em 0 var(--cloud), 1.72em -.03em 0 var(--cloud), 2.42em .44em 0 var(--cloud); }
    .weather-symbol.fog::before { width: 82%; height: 8%; left: 9%; top: 30%; border-radius: 999px; background: var(--mist); box-shadow: -.18em 1em 0 var(--mist), .36em 2em 0 var(--mist), -.08em 3em 0 var(--mist); }
    .weather-symbol.fog::after { width: 58%; height: 8%; left: 21%; top: 12%; border-radius: 999px; background: rgba(217,233,255,.6); }
    .weather-symbol.storm::after { width: 42%; height: 58%; left: 32%; top: 46%; background: var(--sun); clip-path: polygon(43% 0,100% 0,66% 39%,98% 39%,22% 100%,42% 54%,8% 54%); filter: drop-shadow(0 0 .28em rgba(255,213,61,.55)); }
    .weather-meta { grid-column: 1 / -1; display: grid; gap: .45vh; color: #d9e9ff; font-size: clamp(10px, 2.8vw, 38px); font-weight: 850; text-transform: uppercase; }
    .weather-meta span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .news-card { display: grid; grid-template-rows: minmax(0, 1fr) 53.4%; min-height: 0; border-bottom: 1px solid #d6dde5; overflow: hidden; }
    .news-photo { position: relative; overflow: hidden; background: linear-gradient(180deg, rgba(7,23,37,.02), rgba(7,23,37,.18)), url("https://www.americascup.com/images/m30505_crop169005_1280x720_1783368098E0B2.jpg") center/cover no-repeat; }
    .news-body { min-height: 0; padding: 4.2% 5.6%; background: rgba(247,251,255,.94); overflow: hidden; }
    .news-label { display: inline-block; margin-bottom: 2%; padding: 1.4% 2.5%; background: #d71920; color: #fff; font-size: clamp(10px, 2.6vw, 34px); font-weight: 950; text-transform: uppercase; }
    .news-headline { font-size: clamp(18px, 4.35vw, 52px); line-height: 1.02; max-height: 2.16em; font-weight: 950; text-transform: uppercase; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
    .news-meta { margin-top: 2.8%; color: #526273; font-size: clamp(10px, 2.65vw, 34px); font-weight: 800; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sponsor { display: grid; grid-template-rows: auto minmax(0, 1fr); align-content: center; gap: 9%; min-height: 0; padding: 5.6%; overflow: hidden; background: #081522; color: #fff; border-top: .8vh solid #3299c9; }
    .sponsor-title { color: #3299c9; font-size: clamp(12px, 3.2vw, 42px); font-weight: 900; text-transform: uppercase; }
    .countdown { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2.1%; min-height: 0; }
    .count-item { min-width: 0; padding: 9% 2%; background: rgba(255,255,255,.1); text-align: center; overflow: hidden; }
    .count-item strong { display: block; font-size: clamp(22px, 6.2vw, 80px); line-height: 1; font-variant-numeric: tabular-nums; }
    .count-item span { color: #a9b9c8; font-size: clamp(9px, 2.3vw, 30px); font-weight: 900; text-transform: uppercase; }
  </style>
</head>
<body>
  <aside class="rail">
    <section class="weather">
      <div class="weather-kicker">Naples Weather</div>
      <div class="weather-temp" id="weatherTemp">--°</div>
      <div class="weather-icon"><div class="weather-symbol sun" id="weatherIcon"></div></div>
      <div class="weather-meta"><span id="weatherCondition">Updating current conditions</span><span id="weatherWind">Wind -- km/h</span><span id="weatherUpdated">Weather source pending</span></div>
    </section>
    <article class="news-card"><div class="news-photo" id="newsPhoto"></div><div class="news-body"><div class="news-label">Latest</div><div class="news-headline" id="sideHeadline">First sail for La Roche-Posay Racing Team</div><div class="news-meta" id="sideMeta">America's Cup News</div></div></article>
    <section class="sponsor"><div class="sponsor-title">Next Race Starts:</div><div class="countdown"><div class="count-item"><strong id="days">000</strong><span>Days</span></div><div class="count-item"><strong id="hours">00</strong><span>Hrs</span></div><div class="count-item"><strong id="mins">00</strong><span>Min</span></div><div class="count-item"><strong id="secs">00</strong><span>Sec</span></div></div></section>
  </aside>
  <script>
    const CONFIG = { timeZone: "Europe/Rome", matchStart: "2026-09-20T14:00:00+02:00", rssCorsProxy: "https://api.allorigins.win/raw?url=", newsFeedUrl: "https://rss.app/feeds/H9b85gvlBGoYeY7d.xml", weatherUrl: "https://api.open-meteo.com/v1/forecast?latitude=40.8518&longitude=14.2681&current=temperature_2m,weather_code,wind_speed_10m&timezone=Europe%2FRome", weatherFallback: { temperature_2m: 26, weather_code: 2, wind_speed_10m: 3 }, newsStories: [{ title: '"Wow - what an amazing place to sail!"', meta: "America's Cup News • 7 Jul 2026", image: "https://www.americascup.com/images/m30505_crop169005_1280x720_1783368098E0B2.jpg" }, { title: "Emirates Team New Zealand takes their first flight in the Bay of Naples", meta: "America's Cup News • 6 Jul 2026", image: "https://www.americascup.com/images/m30503_crop169005_1280x720_1783367731D94D.jpg" }, { title: "First sail for La Roche-Posay Racing Team", meta: "Latest from the feed • 6 Jul 2026", image: "https://www.americascup.com/images/m30429_crop169005_1280x720_178276503377B3.jpg" }] };
    const two = value => String(value).padStart(2, "0");
    function weatherCodeDetails(code) { if (code === 0) return { icon: "sun", label: "Clear sky" }; if ([1,2].includes(code)) return { icon: "cloud", label: "Partly cloudy" }; if (code === 3) return { icon: "cloud", label: "Cloudy" }; if ([45,48].includes(code)) return { icon: "fog", label: "Fog" }; if ([51,53,55,56,57].includes(code)) return { icon: "drizzle", label: "Drizzle" }; if ([61,63,65,66,67,80,81,82].includes(code)) return { icon: "rain", label: "Rain" }; if ([71,73,75,77,85,86].includes(code)) return { icon: "snow", label: "Snow" }; if ([95,96,99].includes(code)) return { icon: "storm", label: "Storm" }; return { icon: "sun", label: "Naples harbour" }; }
    function weatherTimestamp(prefix) { return prefix + " " + new Intl.DateTimeFormat("en-GB", { timeZone: CONFIG.timeZone, hour: "2-digit", minute: "2-digit", hour12: false }).format(new Date()); }
    function renderWeather(current, sourceLabel) { const details = weatherCodeDetails(Number(current.weather_code)); weatherTemp.textContent = Math.round(Number(current.temperature_2m)) + "°"; weatherIcon.className = "weather-symbol " + details.icon; weatherCondition.textContent = details.label; weatherWind.textContent = "Wind " + Math.round(Number(current.wind_speed_10m)) + " km/h"; weatherUpdated.textContent = weatherTimestamp(sourceLabel); }
    async function loadWeather() { renderWeather(CONFIG.weatherFallback, "Fallback"); try { const response = await fetch(CONFIG.weatherUrl, { cache: "no-store" }); if (!response.ok) throw new Error("Weather failed"); const data = await response.json(); renderWeather(data.current || CONFIG.weatherFallback, "Live update"); } catch (error) { renderWeather(CONFIG.weatherFallback, "Fallback"); } }
    function trimHeadline(value, maxLength = 48) { const clean = String(value || "").replace(/\s+/g, " ").trim(); if (clean.length <= maxLength) return clean; const cut = clean.slice(0, maxLength + 1); const boundary = cut.lastIndexOf(" "); return cut.slice(0, boundary > 32 ? boundary : maxLength).trim() + "..."; }
    function firstElementByLocalName(node, localName) { return [...node.getElementsByTagName("*")].find(item => item.localName === localName); }
    function imageFromDescription(description) { const match = String(description || "").match(/<img[^>]+src=["']([^"']+)["']/i); return match ? match[1] : ""; }
    function formatStoryDate(value) { const date = new Date(value); if (Number.isNaN(date.getTime())) return "America's Cup News"; return new Intl.DateTimeFormat("en-GB", { timeZone: CONFIG.timeZone, day: "numeric", month: "short", year: "numeric" }).format(date); }
    function parseNewsFeed(xml) { const doc = new DOMParser().parseFromString(xml, "text/xml"); return [...doc.querySelectorAll("item")].map(item => { const media = firstElementByLocalName(item, "content"); const description = item.querySelector("description")?.textContent?.trim() || ""; const title = item.querySelector("title")?.textContent?.trim(); const creator = firstElementByLocalName(item, "creator")?.textContent?.trim(); const pubDate = item.querySelector("pubDate")?.textContent?.trim(); const image = media?.getAttribute("url") || imageFromDescription(description); return { title: trimHeadline(title), image, meta: (creator && creator !== "@americsacup" ? creator : "America's Cup News") + " • " + formatStoryDate(pubDate) }; }).filter(story => story.title && story.image).slice(0, 3); }
    async function fetchTextWithProxyFallback(url) { try { const response = await fetch(url, { cache: "no-store" }); if (!response.ok) throw new Error("Direct failed"); return response.text(); } catch (error) { const response = await fetch(CONFIG.rssCorsProxy + encodeURIComponent(url), { cache: "no-store" }); if (!response.ok) throw new Error("Proxy failed"); return response.text(); } }
    function renderNewsStory(index) { const story = CONFIG.newsStories[index % CONFIG.newsStories.length]; newsPhoto.style.backgroundImage = 'linear-gradient(180deg, rgba(7,23,37,.02), rgba(7,23,37,.18)), url("' + story.image + '")'; sideHeadline.textContent = trimHeadline(story.title); sideMeta.textContent = story.meta || "America's Cup News"; }
    async function loadNewsStories() { renderNewsStory(0); try { const xml = await fetchTextWithProxyFallback(CONFIG.newsFeedUrl); const stories = parseNewsFeed(xml); if (stories.length) { CONFIG.newsStories = stories; renderNewsStory(0); } } catch (error) {} }
    function setupNewsRotation() { let index = 0; setInterval(() => { index = (index + 1) % CONFIG.newsStories.length; renderNewsStory(index); }, 30000); }
    function updateCountdown() { const now = new Date(); const diff = Math.max(0, new Date(CONFIG.matchStart) - now); days.textContent = String(Math.floor(diff / 86400000)).padStart(3, "0"); hours.textContent = two(Math.floor((diff % 86400000) / 3600000)); mins.textContent = two(Math.floor((diff % 3600000) / 60000)); secs.textContent = two(Math.floor((diff % 60000) / 1000)); }
    updateCountdown(); setInterval(updateCountdown, 1000); loadWeather(); setInterval(loadWeather, 30 * 60 * 1000); loadNewsStories().then(setupNewsRotation);
  </script>
</body>
</html>
